
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mini Car Racing Game</title>

    <link rel="stylesheet" href="amish.css">
</head>

<body>

    <h1>🏁 Mini Car Racing</h1>
    <p class="subtitle">Enjoy the race!</p>

    <div class="game-container">

        <div class="score-board">

            <div>
                <h3>Score</h3>
                <p>0000</p>
            </div>

            <div>
                <h3>Speed</h3>
                <p>120 km/h</p>
            </div>

            <div>
                <h3>Level</h3>
                <p>01</p>
            </div>

        </div>

        <div class="road">

            <div class="road-lines"></div>

            <img src="blue_car(2) copy.png"
                 class="car enemy enemy-one"
                 alt="Blue enemy car">

            <img src="yellow_taxi(2).png"
                 class="car enemy enemy-two"
                 alt="Yellow enemy car">

            <img src="police_car(2) copy.png"
                 class="car enemy enemy-three"
                 alt="Police enemy car">

            <img src="red_race_car(2) copy.png"
                 class="car player"
                 alt="Player racing car">

        </div>


        <button class="start-btn">START RACE</button>


        <p class="instructions">
            Stay focused on the road to reach level 02!!
        </p>

    </div>

</body>
</html>
